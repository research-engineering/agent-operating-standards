schema_version: "agent-operating-standards.catalog/v1"
name: "Agent Operating Standards"
canonical: true
catalog_owner: "standards.catalog.yaml"
admission_rule: "Only entries listed in this catalog are admitted standards."
non_claims:
  - "The catalog does not make any adopting repository compliant by itself."
  - "The catalog does not define workflow gates unless a workflow standard is admitted."
standards:
  - id: "meta.standards-catalog.v1"
    title: "Standards Catalog"
    path: "standards/meta/standards-catalog/v1/standard.md"
    status: "active"
    owner_surface: "standards/meta/standards-catalog/v1/standard.md"
    canonical_schema: "standards/meta/standards-catalog/v1/schema.json"
    applies_to:
      - "standards.catalog.yaml"
  - id: "authority.claim-types.v1"
    title: "Claim Type Authority"
    path: "standards/authority/claim-types/v1/standard.md"
    status: "active"
    owner_surface: "standards/authority/claim-types/v1/standard.md"
    canonical_schema: null
    applies_to:
      - "all artifacts"
  - id: "authority.exception-protocol.v1"
    title: "Exception Protocol"
    path: "standards/authority/exception-protocol/v1/standard.md"
    status: "active"
    owner_surface: "standards/authority/exception-protocol/v1/standard.md"
    canonical_schema: "standards/authority/exception-protocol/v1/schema.json"
    applies_to:
      - "artifact standards"
      - "repository bindings"
  - id: "meta.repository-binding.v1"
    title: "Repository Standards Binding"
    path: "standards/meta/repository-binding/v1/standard.md"
    status: "active"
    owner_surface: "standards/meta/repository-binding/v1/standard.md"
    canonical_schema: "standards/meta/repository-binding/v1/schema.json"
    applies_to:
      - "docs/DOCS_CONTRACT.yaml"
  - id: "artifact.roadmap.v1"
    title: "Roadmap Artifact"
    path: "standards/artifacts/roadmap/v1/standard.md"
    status: "active"
    owner_surface: "standards/artifacts/roadmap/v1/standard.md"
    canonical_schema: "standards/artifacts/roadmap/v1/schema.json"
    applies_to:
      - "roadmap.yaml"
      - "ROADMAP.md projections"
  - id: "artifact.pull-request-description.v1"
    title: "Pull Request Description Artifact"
    path: "standards/artifacts/pull-request-description/v1/standard.md"
    status: "active"
    owner_surface: "standards/artifacts/pull-request-description/v1/standard.md"
    canonical_schema: "standards/artifacts/pull-request-description/v1/schema.json"
    applies_to:
      - "pull request descriptions"
      - ".github/pull_request_template.md projections"
