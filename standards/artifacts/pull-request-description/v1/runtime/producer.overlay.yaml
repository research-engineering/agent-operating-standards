schema_version: agent-operating-standards.runtime-contract/v1
standard: artifact.pull-request-description.v1
contract_type: role_overlay
role: producer
requires:
  core: standards/artifacts/pull-request-description/v1/runtime/core.contract.yaml
  schema: standards/artifacts/pull-request-description/v1/schema.json
workflow:
- Inspect diff and claim owners; collect the core required inputs.
- Validate the draft against requires.schema and every core.semantic_rules entry.
- Evaluate core.agent_contract.decision_tree with resolved facts; retain evidence metadata independently of display.
- Render selected sections and answer applicable questions; report unresolved facts before claiming compliance.
non_claims:
- This overlay adds role workflow only. Artifact validity is owned by core and its referenced schema.
