# Generated by npm run generate. Edit the declared source owners.
schema_version: agent-operating-standards.runtime-contract/v1
standard: artifact.pull-request-description.v1
contract_type: normative_core
role: core
source_manifest: standards/artifacts/pull-request-description/v1/standard.yaml
artifact_schema: standards/artifacts/pull-request-description/v1/schema.json
agent_contract:
  final_instruction: Create a PR title and structured draft. Use the selected schema and every semantic rule.
    Evaluate decision_tree.when with the declared review_facts, profiles, readiness and urgency. Render
    Summary and Context plus exactly the selected optional sections. Unknown facts prevent a compliance claim
    only when a section remains unresolved after all rules are combined. Evidence metadata may be stored
    without a visible Evidence section.
  required_inputs:
    - pull_request_title
    - diff_summary
    - problem_context
    - changed_owner_surfaces
    - change_profiles
    - readiness_state
    - urgency
    - review_facts
  required_sections:
    - Summary
    - Context
  optional_sections:
    - Impact
    - Changes
    - Links
    - Evidence
    - Risk / Rollback
    - Migration / Rollout
    - Security / Privacy
    - Visual Evidence
    - Non-Claims
    - Review Focus
  decision_tree:
    - id: core
      trigger: core
      when: true
      include_sections:
        - Summary
        - Context
      omit_when: Only when every rule for this visible section is false; unknown remains unresolved.
    - id: impact
      trigger: impact
      when:
        fact: impact
      include_sections:
        - Impact
      omit_when: Only when every rule for this visible section is false; unknown remains unresolved.
    - id: changes
      trigger: changes
      when:
        fact: expanded_review
      include_sections:
        - Changes
      omit_when: Only when every rule for this visible section is false; unknown remains unresolved.
    - id: links
      trigger: links
      when:
        any:
          - fact: external_owner
          - profile: generated
      include_sections:
        - Links
      omit_when: Only when every rule for this visible section is false; unknown remains unresolved.
    - id: evidence
      trigger: evidence
      when:
        fact: visible_evidence
      include_sections:
        - Evidence
      omit_when: Only when every rule for this visible section is false; unknown remains unresolved.
    - id: risk
      trigger: risk
      when:
        any:
          - fact: risk
          - any:
              - profile: migration
              - profile: release
          - urgency: emergency
      include_sections:
        - Risk / Rollback
      omit_when: Only when every rule for this visible section is false; unknown remains unresolved.
    - id: rollout
      trigger: rollout
      when:
        any:
          - fact: rollout
          - any:
              - profile: migration
              - profile: release
      include_sections:
        - Migration / Rollout
      omit_when: Only when every rule for this visible section is false; unknown remains unresolved.
    - id: security
      trigger: security
      when:
        any:
          - fact: security
          - profile: security
      include_sections:
        - Security / Privacy
      omit_when: Only when every rule for this visible section is false; unknown remains unresolved.
    - id: visual
      trigger: visual
      when:
        fact: visual
      include_sections:
        - Visual Evidence
      omit_when: Only when every rule for this visible section is false; unknown remains unresolved.
    - id: non_claims
      trigger: non_claims
      when:
        any:
          - fact: overclaim
          - any:
              - readiness: draft
              - readiness: blocked
          - urgency: emergency
          - all:
              - any:
                  - profile: generated
                  - any:
                      - profile: migration
                      - profile: release
              - absent: evidence
      include_sections:
        - Non-Claims
      omit_when: Only when every rule for this visible section is false; unknown remains unresolved.
    - id: focus
      trigger: focus
      when:
        any:
          - fact: review_focus
          - any:
              - readiness: draft
              - readiness: blocked
      include_sections:
        - Review Focus
      omit_when: Only when every rule for this visible section is false; unknown remains unresolved.
  reviewer_instruction: Evaluate pull request descriptions by asking universal questions first and conditional
    questions only when their trigger is true. Do not require business-cause or advantage claims unless a
    business owner surface or review-relevant impact exists.
  review_questions:
    universal:
      - id: PRD-RQ-001
        question: What changed?
        answered_by:
          - Summary
          - Changes
          - review_scope
        failure_mode: The reviewer cannot identify the reviewed change.
      - id: PRD-RQ-002
        question: Why does this change exist?
        answered_by:
          - Context
          - Links
        failure_mode: The reviewer cannot decide whether the change should exist.
      - id: PRD-RQ-003
        question: Is the review surface explicit enough?
        answered_by:
          - review_scope
          - Changes
        failure_mode: The reviewer cannot find the owner surfaces that need review.
      - id: PRD-RQ-004
        question: Which optional facts are triggered by this change?
        answered_by:
          - change_profiles
          - decision_tree
        failure_mode: Impact, risk, evidence, rollout, security, or review-focus obligations are hidden.
      - id: PRD-RQ-005
        question: Is the pull request overstating what it proves?
        answered_by:
          - Non-Claims
          - Evidence
          - Links
        failure_mode: Readers infer stronger readiness, release, security, runtime, or validation claims than the PR owns.
    conditional:
      - id: PRD-RQ-010
        trigger: user_business_operator_developer_cost_accessibility_compliance_or_support_effect
        question: What review-relevant impact or value follows from this change?
        answered_by:
          - Impact
        omit_when: the change has no effect beyond the reviewed source surface
        failure_mode: The reviewer cannot evaluate product, business, operational, developer, support, cost,
          accessibility, or compliance impact.
      - id: PRD-RQ-011
        trigger: business_product_incident_policy_or_requirement_claim_matters
        question: Which owner surface proves the cause, requirement, or priority?
        answered_by:
          - Links
        omit_when: no external owner surface owns a relevant cause, requirement, incident, policy, or priority claim
        failure_mode: The PR body promotes convenient business context into authority.
      - id: PRD-RQ-012
        trigger: benefit_readiness_safety_freshness_performance_or_equivalence_is_claimed
        question: What evidence supports the claim, or what non-claim bounds it?
        answered_by:
          - Evidence
          - Non-Claims
        omit_when: no proof-bearing or overclaim-prone claim is made
        failure_mode: The PR implies value, readiness, safety, freshness, performance, or equivalence without proof or
          bounds.
      - id: PRD-RQ-013
        trigger: hard_to_revert_or_non_obvious_failure_mode
        question: What can fail and how is it rolled back or forward-fixed?
        answered_by:
          - Risk / Rollback
        omit_when: the change is trivially reversible and has no non-obvious failure mode
        failure_mode: The reviewer cannot evaluate operational failure or reversal risk.
      - id: PRD-RQ-014
        trigger: merge_order_data_migration_flags_versions_or_downstream_adoption_matters
        question: What sequencing or rollout fact changes the review decision?
        answered_by:
          - Migration / Rollout
        omit_when: merge order and rollout are irrelevant
        failure_mode: The reviewer cannot evaluate deploy, compatibility, migration, or downstream adoption risk.
      - id: PRD-RQ-015
        trigger: auth_data_secrets_permissions_abuse_or_disclosure_surface_touched
        question: What security or privacy review surface is relevant, without leaking sensitive details?
        answered_by:
          - Security / Privacy
        omit_when: security and privacy posture are not touched
        failure_mode: Security-sensitive change is reviewed as ordinary implementation detail or leaks sensitive context.
      - id: PRD-RQ-016
        trigger: visual_or_rendered_output_needs_review
        question: What visual evidence lets the reviewer inspect the result?
        answered_by:
          - Visual Evidence
        omit_when: visual output is irrelevant
        failure_mode: The reviewer cannot inspect user-visible or rendered output.
      - id: PRD-RQ-017
        trigger: review_path_is_non_obvious
        question: Where should the reviewer focus first?
        answered_by:
          - Review Focus
        omit_when: reviewer should simply review the diff normally
        failure_mode: Reviewer attention is spent on low-risk surfaces while the actual risk is hidden.
  output_format: github_markdown
  proof_policy:
    include_standard_proof_in_output: false
    include_artifact_evidence: Record evidence when proof-bearing claims need it; render visible Evidence only
      when it changes the human review decision.
    proof_location: standards/artifacts/pull-request-description/v1/proofs.yaml
  semantic_obligations:
    - Use every rule from validation.semantic_rules for both production and review.
    - Do not use a non-claim to cancel a positive unsupported assertion.
    - Evaluate review_facts as true, false or unknown from the diff, owner surfaces and available evidence.
      Review their truth independently; schema enum membership proves neither factual truth nor review
      completeness.
    - review_facts.impact means that a material user, business, operator, developer, cost, performance,
      accessibility, compliance or support effect changes review.
    - review_facts.expanded_review means that Summary and platform diff alone do not identify the logical
      review surface. A detailed review_scope field alone does not establish their sufficiency.
    - review_facts.external_owner means that an issue, spec, standard, incident, design, policy or evidence
      owner is needed for a review claim.
    - review_facts.visible_evidence means that evidence visibility changes review because a material failure,
      absence, manual result, security, runtime, release or freshness claim, or reviewer action needs
      attention. Routine passing platform checks alone do not satisfy it. This is the sole Evidence visibility
      predicate.
    - review_facts.risk means that material failure or reversal context is not obvious from the ordinary
      review surface. User-facing or dependency classification alone does not imply it.
    - review_facts.rollout means that sequencing, versions, flags, deployment, migration or downstream
      adoption changes review.
    - review_facts.security means that an auth, data, secrets, logging, permissions, abuse or disclosure
      boundary changes security or privacy review.
    - review_facts.visual means that review requires inspection of visual or rendered output.
    - review_facts.overclaim means that a reader could reasonably infer an unsupported stronger claim.
    - review_facts.review_focus means that a non-obvious review path needs guidance.
    - Combine all rules for each section before reporting unresolved selection. A true disjunct resolves an OR
      and a false conjunct resolves an AND despite an unknown sibling; otherwise unknown propagates.
semantic_rules:
  - id: PRD-SEM-001
    invariant: Every pull request description must answer what changed and why it exists.
    applies_to:
      - title
      - summary
      - context
      - review_scope
      - change_profiles
      - readiness_state
    check: Title, Summary, Context, review_scope, change_profiles, and readiness_state must be non-empty, factual,
      and specific enough to distinguish this PR from nearby changes.
    failure_mode: Reviewers cannot decide whether the change should exist.
    justification_ref: standards/artifacts/pull-request-description/v1/proofs.yaml#PRD-SEM-001
  - id: PRD-SEM-002
    invariant: Visible optional sections follow the single decision tree.
    applies_to:
      - impact
      - changes
      - links
      - evidence
      - risk_and_rollback
      - migration_rollout
      - security_privacy
      - visual_evidence
      - non_claims
      - review_focus
    check: Evaluate every decision_tree.when; union the sections selected by true rules. Omit a section only when
      all its rules are false. A section remains unresolved only when no rule selects it as true and at least
      one remains unknown after predicate composition. These constraints apply to visible sections, not stored
      evidence metadata.
    failure_mode: The PR body becomes boilerplate that reviewers ignore.
    justification_ref: standards/artifacts/pull-request-description/v1/proofs.yaml#PRD-SEM-002
  - id: PRD-SEM-003
    invariant: Storing evidence and displaying it are independent obligations.
    applies_to:
      - evidence
    check: Preserve evidence required to support a claim even when visible_evidence is false. Render Evidence when
      review_facts.visible_evidence is true. Determine that fact from review-relevant failures, missing or
      manual checks, security, runtime, release, freshness, or reviewer action; routine passing
      platform-visible checks alone do not trigger it. Positive observed results require immutable
      repository/head identity and an evidence_ref; verify that the reference actually supports that target
      and claim.
    failure_mode: Either proof is missing for a claim or routine validation noise hides the useful description.
    justification_ref: standards/artifacts/pull-request-description/v1/proofs.yaml#PRD-SEM-003
  - id: PRD-SEM-004
    invariant: The final PR body must not contain a routine Validation section.
    applies_to:
      - evidence
    check: Use Evidence, not Validation, when proof must be visible; do not list commands, checkboxes, or not-run
      tests by default.
    failure_mode: Routine validation boilerplate trains reviewers to skip the description.
    justification_ref: standards/artifacts/pull-request-description/v1/proofs.yaml#PRD-SEM-004
  - id: PRD-SEM-005
    invariant: Links must point to owner surfaces when an external claim owner matters.
    applies_to:
      - links
    check: If a PR depends on an issue, standard, spec, schema, incident, policy, design, or evidence artifact,
      include Links to those owner surfaces. Issue links must classify their relationship.
    failure_mode: The PR body promotes convenient context into authority.
    justification_ref: standards/artifacts/pull-request-description/v1/proofs.yaml#PRD-SEM-005
  - id: PRD-SEM-006
    invariant: Risk and rollback have one explicit trigger.
    applies_to:
      - risk_and_rollback
    check: Render Risk / Rollback exactly when review_facts.risk is true, a migration or release profile applies,
      or urgency is emergency. Set risk true for material failure or reversal information not otherwise
      obvious. A trivial reversible user-facing or dependency change does not trigger risk solely by category.
      Migration/release/emergency are explicit conservative defaults in this adopted profile, not universal
      logical necessities.
    failure_mode: Reviewers either miss operational risk or read irrelevant rollback boilerplate.
    justification_ref: standards/artifacts/pull-request-description/v1/proofs.yaml#PRD-SEM-006
  - id: PRD-SEM-007
    invariant: Impact must be stated when the change affects a decision-maker outside the diff.
    applies_to:
      - impact
    check: Include Impact when users, business behavior, operators, developers, cost, performance, accessibility,
      compliance, or support are affected.
    failure_mode: Reviewers cannot evaluate the change at the correct product or operational level.
    justification_ref: standards/artifacts/pull-request-description/v1/proofs.yaml#PRD-SEM-007
  - id: PRD-SEM-008
    invariant: Security and privacy claims must not be hidden in generic prose.
    applies_to:
      - security_privacy
    check: Include Security / Privacy when auth, authorization, secrets, sensitive data, logging, permissions,
      abuse controls, or disclosure surfaces are touched. Do not include secrets, credentials, exploit
      instructions, sensitive repository data, or disclosure details that belong in a private security
      channel.
    failure_mode: Security-sensitive changes are reviewed as ordinary implementation detail.
    justification_ref: standards/artifacts/pull-request-description/v1/proofs.yaml#PRD-SEM-008
  - id: PRD-SEM-009
    invariant: Non-claims must block predictable overclaims.
    applies_to:
      - non_claims
    check: If readers could infer release readiness, production readiness, downstream adoption, runtime proof,
      security approval, or complete validation that the PR does not prove, include Non-Claims.
    failure_mode: Readers infer stronger readiness or authority than the PR owns.
    justification_ref: standards/artifacts/pull-request-description/v1/proofs.yaml#PRD-SEM-009
  - id: PRD-SEM-010
    invariant: Review focus has the same rule for producer and reviewer.
    applies_to:
      - review_focus
    check: Render Review Focus when review_facts.review_focus is true or readiness_state is draft or blocked. In
      draft/blocked cases explain the missing readiness condition or requested feedback even when the diff is
      obvious. It does not create new acceptance criteria.
    failure_mode: The PR body creates requirements outside the owner surface.
    justification_ref: standards/artifacts/pull-request-description/v1/proofs.yaml#PRD-SEM-010
  - id: PRD-SEM-011
    invariant: Independent profiles and process dimensions compose without losing obligations.
    applies_to:
      - change_profiles
    check: Apply every matching change profile independently. readiness_state is draft, blocked or
      ready_for_review; urgency is normal or emergency. Emergency is not a change profile or readiness value.
      The decision tree unions all triggered obligations.
    failure_mode: A single primary type hides secondary risk and proof obligations.
    justification_ref: standards/artifacts/pull-request-description/v1/proofs.yaml#PRD-SEM-011
  - id: PRD-SEM-012
    invariant: Generated artifacts retain source links and an explicit evidence boundary.
    applies_to:
      - change_profiles
      - links
      - evidence
    check: The generated profile requires source owner Links and evidence or a specific non-claim that freshness
      is not established. Stored evidence need not render when visible_evidence is false. A non-claim cannot
      discharge a simultaneously asserted positive freshness claim.
    failure_mode: Generated artifacts become stale or authoritative without proof.
    justification_ref: standards/artifacts/pull-request-description/v1/proofs.yaml#PRD-SEM-012
  - id: PRD-SEM-013
    invariant: The adopted migration and release profiles conservatively require sequencing and reversal context.
    applies_to:
      - change_profiles
      - migration_rollout
      - risk_and_rollback
      - evidence
    check: Migration or release profiles require Migration / Rollout, Risk / Rollback, and evidence or explicit
      readiness non-claims. This is a declared profile convention for these review risks; it is not a claim
      that all releases are inherently hard to revert.
    failure_mode: Reviewers cannot evaluate deploy, compatibility, or release risk.
    justification_ref: standards/artifacts/pull-request-description/v1/proofs.yaml#PRD-SEM-013
  - id: PRD-SEM-014
    invariant: Dependency changes must surface supply-chain review facts when material.
    applies_to:
      - change_profiles
      - impact
      - evidence
      - risk_and_rollback
    check: If change_profiles includes dependency, state material runtime/developer impact and include advisory,
      license, lockfile, install-script, or transitive-risk evidence when relevant.
    failure_mode: A dependency change is reviewed as a version number instead of a supply-chain change.
    justification_ref: standards/artifacts/pull-request-description/v1/proofs.yaml#PRD-SEM-014
  - id: PRD-SEM-015
    invariant: Refactor and formatting profiles must not imply behavior change.
    applies_to:
      - change_profiles
      - context
      - non_claims
      - evidence
    check: If change_profiles includes refactor or formatting and behavior is not intended to change, state that
      boundary in Context or Non-Claims; include evidence only when behavior preservation is a review-relevant
      claim.
    failure_mode: Readers infer behavior change from a mechanical or structural PR, or infer equivalence without proof.
    justification_ref: standards/artifacts/pull-request-description/v1/proofs.yaml#PRD-SEM-015
  - id: PRD-SEM-016
    invariant: Readiness and urgency are independent and visible when material.
    applies_to:
      - readiness_state
      - non_claims
      - review_focus
      - risk_and_rollback
    check: Draft or blocked readiness requires Non-Claims and Review Focus. Emergency urgency requires Risk /
      Rollback, Non-Claims, and available evidence or explicit evidence limitations, regardless of readiness.
      Do not imply complete validation.
    failure_mode: Reviewers mistake unfinished or expedited work for ordinary merge-ready work.
    justification_ref: standards/artifacts/pull-request-description/v1/proofs.yaml#PRD-SEM-016
  - id: PRD-SEM-017
    invariant: Issue links must distinguish contextual reference from lifecycle-changing closure.
    applies_to:
      - links
    check: Every link with type issue must include relationship. Use fixes, closes, or resolves only when merging
      this PR is intended to satisfy and close or resolve the target issue under the hosting platform's
      target-branch semantics. Use relates_to, references, depends_on, blocks, supersedes, or duplicates when
      no closure claim is intended.
    failure_mode: A neutral issue reference is rendered as Fixes or Closes, causing an accidental lifecycle claim
      or issue closure.
    justification_ref: standards/artifacts/pull-request-description/v1/proofs.yaml#PRD-SEM-017
  - id: PRD-SEM-018
    invariant: Reviewer questions are a bounded audit checklist, not a sufficiency theorem.
    applies_to:
      - summary
      - context
      - impact
      - links
      - evidence
      - risk_and_rollback
      - migration_rollout
      - security_privacy
      - visual_evidence
      - non_claims
      - review_focus
    check: Use the universal questions and each conditional question whose factual trigger applies. Answer through
      the selected visible sections or platform/source evidence. The questions cover this declared review
      model; new material concerns require extending that model, not claiming global completeness. Unknown
      triggers remain unresolved.
    failure_mode: The PR either omits a review-critical answer or publishes a noisy questionnaire as boilerplate.
    justification_ref: standards/artifacts/pull-request-description/v1/proofs.yaml#PRD-SEM-018
non_claims:
  - This generated core preserves declared rules; it does not prove facts, authorizations, or compliance of an
    external agent.
