schema_version: agent-operating-standards.standard-package/v1
id: artifact.pull-request-description.v1
title: Pull Request Description Artifact
lifecycle: active
owner_surface: standards/artifacts/pull-request-description/v1/standard.md
agent_entrypoint: standards/artifacts/pull-request-description/v1/standard.yaml
artifact:
  type: pull_request_description
  canonical_surface: platform_pull_request_title_and_body
  generated_projection: .github/pull_request_template.md
  scope: pull request review
authority:
  owned_claim_types:
  - orientation
  - task_detail
  - evidence
  - agent_instruction
  forbidden_claim_types:
  - requirement
  - architecture
  - decision
  - api_contract
  - security
  - runtime_fact
  - release_fact
  - release_guarantee
  precedence: A pull request description orients review and may cite evidence; stronger owner surfaces define requirements,
    architecture, contracts, security, releases, and runtime truth.
agent_contract:
  final_instruction: Create a PR title and structured draft. Use the selected schema and every semantic rule. Evaluate
    decision_tree.when with the declared review_facts, profiles, readiness and urgency. Render Summary and Context
    plus exactly the selected optional sections. Unknown facts prevent a compliance claim only when a section
    remains unresolved after all rules are combined. Evidence metadata may be stored without a visible Evidence section.
  required_inputs:
  - pull_request_title
  - diff_summary
  - problem_context
  - changed_owner_surfaces
  - change_profiles
  - readiness_state
  - urgency
  - review_facts
  required_sections:
  - Summary
  - Context
  optional_sections:
  - Impact
  - Changes
  - Links
  - Evidence
  - Risk / Rollback
  - Migration / Rollout
  - Security / Privacy
  - Visual Evidence
  - Non-Claims
  - Review Focus
  decision_tree:
  - id: core
    trigger: core
    when: true
    include_sections:
    - Summary
    - Context
    omit_when: Only when every rule for this visible section is false; unknown remains unresolved.
  - id: impact
    trigger: impact
    when:
      fact: impact
    include_sections:
    - Impact
    omit_when: Only when every rule for this visible section is false; unknown remains unresolved.
  - id: changes
    trigger: changes
    when:
      fact: expanded_review
    include_sections:
    - Changes
    omit_when: Only when every rule for this visible section is false; unknown remains unresolved.
  - id: links
    trigger: links
    when:
      any:
      - fact: external_owner
      - profile: generated
    include_sections:
    - Links
    omit_when: Only when every rule for this visible section is false; unknown remains unresolved.
  - id: evidence
    trigger: evidence
    when:
      fact: visible_evidence
    include_sections:
    - Evidence
    omit_when: Only when every rule for this visible section is false; unknown remains unresolved.
  - id: risk
    trigger: risk
    when:
      any:
      - fact: risk
      - any:
        - profile: migration
        - profile: release
      - urgency: emergency
    include_sections:
    - Risk / Rollback
    omit_when: Only when every rule for this visible section is false; unknown remains unresolved.
  - id: rollout
    trigger: rollout
    when:
      any:
      - fact: rollout
      - any:
        - profile: migration
        - profile: release
    include_sections:
    - Migration / Rollout
    omit_when: Only when every rule for this visible section is false; unknown remains unresolved.
  - id: security
    trigger: security
    when:
      any:
      - fact: security
      - profile: security
    include_sections:
    - Security / Privacy
    omit_when: Only when every rule for this visible section is false; unknown remains unresolved.
  - id: visual
    trigger: visual
    when:
      fact: visual
    include_sections:
    - Visual Evidence
    omit_when: Only when every rule for this visible section is false; unknown remains unresolved.
  - id: non_claims
    trigger: non_claims
    when:
      any:
      - fact: overclaim
      - any:
        - readiness: draft
        - readiness: blocked
      - urgency: emergency
      - all:
        - any:
          - profile: generated
          - any:
            - profile: migration
            - profile: release
        - absent: evidence
    include_sections:
    - Non-Claims
    omit_when: Only when every rule for this visible section is false; unknown remains unresolved.
  - id: focus
    trigger: focus
    when:
      any:
      - fact: review_focus
      - any:
        - readiness: draft
        - readiness: blocked
    include_sections:
    - Review Focus
    omit_when: Only when every rule for this visible section is false; unknown remains unresolved.
  reviewer_instruction: Evaluate pull request descriptions by asking universal questions first and conditional questions
    only when their trigger is true. Do not require business-cause or advantage claims unless a business owner surface
    or review-relevant impact exists.
  review_questions:
    universal:
    - id: PRD-RQ-001
      question: What changed?
      answered_by:
      - Summary
      - Changes
      - review_scope
      failure_mode: The reviewer cannot identify the reviewed change.
    - id: PRD-RQ-002
      question: Why does this change exist?
      answered_by:
      - Context
      - Links
      failure_mode: The reviewer cannot decide whether the change should exist.
    - id: PRD-RQ-003
      question: Is the review surface explicit enough?
      answered_by:
      - review_scope
      - Changes
      failure_mode: The reviewer cannot find the owner surfaces that need review.
    - id: PRD-RQ-004
      question: Which optional facts are triggered by this change?
      answered_by:
      - change_profiles
      - decision_tree
      failure_mode: Impact, risk, evidence, rollout, security, or review-focus obligations are hidden.
    - id: PRD-RQ-005
      question: Is the pull request overstating what it proves?
      answered_by:
      - Non-Claims
      - Evidence
      - Links
      failure_mode: Readers infer stronger readiness, release, security, runtime, or validation claims than the
        PR owns.
    conditional:
    - id: PRD-RQ-010
      trigger: user_business_operator_developer_cost_accessibility_compliance_or_support_effect
      question: What review-relevant impact or value follows from this change?
      answered_by:
      - Impact
      omit_when: the change has no effect beyond the reviewed source surface
      failure_mode: The reviewer cannot evaluate product, business, operational, developer, support, cost, accessibility,
        or compliance impact.
    - id: PRD-RQ-011
      trigger: business_product_incident_policy_or_requirement_claim_matters
      question: Which owner surface proves the cause, requirement, or priority?
      answered_by:
      - Links
      omit_when: no external owner surface owns a relevant cause, requirement, incident, policy, or priority claim
      failure_mode: The PR body promotes convenient business context into authority.
    - id: PRD-RQ-012
      trigger: benefit_readiness_safety_freshness_performance_or_equivalence_is_claimed
      question: What evidence supports the claim, or what non-claim bounds it?
      answered_by:
      - Evidence
      - Non-Claims
      omit_when: no proof-bearing or overclaim-prone claim is made
      failure_mode: The PR implies value, readiness, safety, freshness, performance, or equivalence without proof
        or bounds.
    - id: PRD-RQ-013
      trigger: hard_to_revert_or_non_obvious_failure_mode
      question: What can fail and how is it rolled back or forward-fixed?
      answered_by:
      - Risk / Rollback
      omit_when: the change is trivially reversible and has no non-obvious failure mode
      failure_mode: The reviewer cannot evaluate operational failure or reversal risk.
    - id: PRD-RQ-014
      trigger: merge_order_data_migration_flags_versions_or_downstream_adoption_matters
      question: What sequencing or rollout fact changes the review decision?
      answered_by:
      - Migration / Rollout
      omit_when: merge order and rollout are irrelevant
      failure_mode: The reviewer cannot evaluate deploy, compatibility, migration, or downstream adoption risk.
    - id: PRD-RQ-015
      trigger: auth_data_secrets_permissions_abuse_or_disclosure_surface_touched
      question: What security or privacy review surface is relevant, without leaking sensitive details?
      answered_by:
      - Security / Privacy
      omit_when: security and privacy posture are not touched
      failure_mode: Security-sensitive change is reviewed as ordinary implementation detail or leaks sensitive context.
    - id: PRD-RQ-016
      trigger: visual_or_rendered_output_needs_review
      question: What visual evidence lets the reviewer inspect the result?
      answered_by:
      - Visual Evidence
      omit_when: visual output is irrelevant
      failure_mode: The reviewer cannot inspect user-visible or rendered output.
    - id: PRD-RQ-017
      trigger: review_path_is_non_obvious
      question: Where should the reviewer focus first?
      answered_by:
      - Review Focus
      omit_when: reviewer should simply review the diff normally
      failure_mode: Reviewer attention is spent on low-risk surfaces while the actual risk is hidden.
  output_format: github_markdown
  proof_policy:
    include_standard_proof_in_output: false
    include_artifact_evidence: Record evidence when proof-bearing claims need it; render visible Evidence only when
      it changes the human review decision.
    proof_location: standards/artifacts/pull-request-description/v1/proofs.yaml
  semantic_obligations:
  - Use every rule from validation.semantic_rules for both production and review.
  - Do not use a non-claim to cancel a positive unsupported assertion.
  - Evaluate review_facts as true, false or unknown from the diff, owner surfaces and available evidence. Review
    their truth independently; schema enum membership proves neither factual truth nor review completeness.
  - review_facts.impact means that a material user, business, operator, developer, cost, performance, accessibility,
    compliance or support effect changes review.
  - review_facts.expanded_review means that Summary and platform diff alone do not identify the logical review
    surface. A detailed review_scope field alone does not establish their sufficiency.
  - review_facts.external_owner means that an issue, spec, standard, incident, design, policy or evidence owner
    is needed for a review claim.
  - review_facts.visible_evidence means that evidence visibility changes review because a material failure, absence,
    manual result, security, runtime, release or freshness claim, or reviewer action needs attention. Routine
    passing platform checks alone do not satisfy it. This is the sole Evidence visibility predicate.
  - review_facts.risk means that material failure or reversal context is not obvious from the ordinary review
    surface. User-facing or dependency classification alone does not imply it.
  - review_facts.rollout means that sequencing, versions, flags, deployment, migration or downstream adoption
    changes review.
  - review_facts.security means that an auth, data, secrets, logging, permissions, abuse or disclosure boundary
    changes security or privacy review.
  - review_facts.visual means that review requires inspection of visual or rendered output.
  - review_facts.overclaim means that a reader could reasonably infer an unsupported stronger claim.
  - review_facts.review_focus means that a non-obvious review path needs guidance.
  - Combine all rules for each section before reporting unresolved selection. A true disjunct resolves an OR
    and a false conjunct resolves an AND despite an unknown sibling; otherwise unknown propagates.
runtime_contracts:
  method: shared_core_plus_role_overlays
  invariant: Core is an exact generated projection of agent_contract and all semantic rules; all roles use that
    core and the same artifact schema.
  core: standards/artifacts/pull-request-description/v1/runtime/core.contract.yaml
  roles:
    producer: standards/artifacts/pull-request-description/v1/runtime/producer.overlay.yaml
    reviewer: standards/artifacts/pull-request-description/v1/runtime/reviewer.overlay.yaml
    renderer: standards/artifacts/pull-request-description/v1/runtime/renderer.overlay.yaml
validation:
  schema: standards/artifacts/pull-request-description/v1/schema.json
  semantic_rules: standards/artifacts/pull-request-description/v1/semantic-rules.yaml
  template: standards/artifacts/pull-request-description/v1/template.yaml
  justifications: standards/artifacts/pull-request-description/v1/proofs.yaml
non_claims:
- A pull request description does not define requirements.
- A pull request description does not define architecture, API contracts, or security policy.
- A pull request description does not prove release readiness, production readiness, or downstream adoption unless
  it cites owner evidence.
