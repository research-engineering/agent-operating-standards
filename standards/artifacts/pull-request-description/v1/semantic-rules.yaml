schema_version: agent-operating-standards.semantic-rules/v1
standard: artifact.pull-request-description.v1
scope: pull_request_description
rules:
- id: PRD-SEM-001
  invariant: Every pull request description must answer what changed and why it exists.
  applies_to:
  - title
  - summary
  - context
  - review_scope
  - change_profiles
  - readiness_state
  check: Title, Summary, Context, review_scope, change_profiles, and readiness_state must be non-empty, factual,
    and specific enough to distinguish this PR from nearby changes.
  failure_mode: Reviewers cannot decide whether the change should exist.
  justification_ref: standards/artifacts/pull-request-description/v1/proofs.yaml#PRD-SEM-001
- id: PRD-SEM-002
  invariant: Visible optional sections follow the single decision tree.
  applies_to:
  - impact
  - changes
  - links
  - evidence
  - risk_and_rollback
  - migration_rollout
  - security_privacy
  - visual_evidence
  - non_claims
  - review_focus
  check: Evaluate every decision_tree.when; union the sections selected by true rules. Omit a section only when
    all its rules are false. A section remains unresolved only when no rule selects it as true and at least one
    remains unknown after predicate composition. These constraints apply to visible sections, not stored evidence metadata.
  failure_mode: The PR body becomes boilerplate that reviewers ignore.
  justification_ref: standards/artifacts/pull-request-description/v1/proofs.yaml#PRD-SEM-002
- id: PRD-SEM-003
  invariant: Storing evidence and displaying it are independent obligations.
  applies_to:
  - evidence
  check: Preserve evidence required to support a claim even when visible_evidence is false. Render Evidence when
    review_facts.visible_evidence is true. Determine that fact from review-relevant failures, missing or manual
    checks, security, runtime, release, freshness, or reviewer action; routine passing platform-visible checks alone
    do not trigger it. Positive observed results require immutable repository/head identity and an evidence_ref;
    verify that the reference actually supports that target and claim.
  failure_mode: Either proof is missing for a claim or routine validation noise hides the useful description.
  justification_ref: standards/artifacts/pull-request-description/v1/proofs.yaml#PRD-SEM-003
- id: PRD-SEM-004
  invariant: The final PR body must not contain a routine Validation section.
  applies_to:
  - evidence
  check: Use Evidence, not Validation, when proof must be visible; do not list commands, checkboxes, or not-run
    tests by default.
  failure_mode: Routine validation boilerplate trains reviewers to skip the description.
  justification_ref: standards/artifacts/pull-request-description/v1/proofs.yaml#PRD-SEM-004
- id: PRD-SEM-005
  invariant: Links must point to owner surfaces when an external claim owner matters.
  applies_to:
  - links
  check: If a PR depends on an issue, standard, spec, schema, incident, policy, design, or evidence artifact, include
    Links to those owner surfaces. Issue links must classify their relationship.
  failure_mode: The PR body promotes convenient context into authority.
  justification_ref: standards/artifacts/pull-request-description/v1/proofs.yaml#PRD-SEM-005
- id: PRD-SEM-006
  invariant: Risk and rollback have one explicit trigger.
  applies_to:
  - risk_and_rollback
  check: Render Risk / Rollback exactly when review_facts.risk is true, a migration or release profile applies,
    or urgency is emergency. Set risk true for material failure or reversal information not otherwise obvious. A
    trivial reversible user-facing or dependency change does not trigger risk solely by category. Migration/release/emergency
    are explicit conservative defaults in this adopted profile, not universal logical necessities.
  failure_mode: Reviewers either miss operational risk or read irrelevant rollback boilerplate.
  justification_ref: standards/artifacts/pull-request-description/v1/proofs.yaml#PRD-SEM-006
- id: PRD-SEM-007
  invariant: Impact must be stated when the change affects a decision-maker outside the diff.
  applies_to:
  - impact
  check: Include Impact when users, business behavior, operators, developers, cost, performance, accessibility,
    compliance, or support are affected.
  failure_mode: Reviewers cannot evaluate the change at the correct product or operational level.
  justification_ref: standards/artifacts/pull-request-description/v1/proofs.yaml#PRD-SEM-007
- id: PRD-SEM-008
  invariant: Security and privacy claims must not be hidden in generic prose.
  applies_to:
  - security_privacy
  check: Include Security / Privacy when auth, authorization, secrets, sensitive data, logging, permissions, abuse
    controls, or disclosure surfaces are touched. Do not include secrets, credentials, exploit instructions, sensitive
    repository data, or disclosure details that belong in a private security channel.
  failure_mode: Security-sensitive changes are reviewed as ordinary implementation detail.
  justification_ref: standards/artifacts/pull-request-description/v1/proofs.yaml#PRD-SEM-008
- id: PRD-SEM-009
  invariant: Non-claims must block predictable overclaims.
  applies_to:
  - non_claims
  check: If readers could infer release readiness, production readiness, downstream adoption, runtime proof, security
    approval, or complete validation that the PR does not prove, include Non-Claims.
  failure_mode: Readers infer stronger readiness or authority than the PR owns.
  justification_ref: standards/artifacts/pull-request-description/v1/proofs.yaml#PRD-SEM-009
- id: PRD-SEM-010
  invariant: Review focus has the same rule for producer and reviewer.
  applies_to:
  - review_focus
  check: Render Review Focus when review_facts.review_focus is true or readiness_state is draft or blocked. In draft/blocked
    cases explain the missing readiness condition or requested feedback even when the diff is obvious. It does not
    create new acceptance criteria.
  failure_mode: The PR body creates requirements outside the owner surface.
  justification_ref: standards/artifacts/pull-request-description/v1/proofs.yaml#PRD-SEM-010
- id: PRD-SEM-011
  invariant: Independent profiles and process dimensions compose without losing obligations.
  applies_to:
  - change_profiles
  check: Apply every matching change profile independently. readiness_state is draft, blocked or ready_for_review;
    urgency is normal or emergency. Emergency is not a change profile or readiness value. The decision tree unions
    all triggered obligations.
  failure_mode: A single primary type hides secondary risk and proof obligations.
  justification_ref: standards/artifacts/pull-request-description/v1/proofs.yaml#PRD-SEM-011
- id: PRD-SEM-012
  invariant: Generated artifacts retain source links and an explicit evidence boundary.
  applies_to:
  - change_profiles
  - links
  - evidence
  check: The generated profile requires source owner Links and evidence or a specific non-claim that freshness is
    not established. Stored evidence need not render when visible_evidence is false. A non-claim cannot discharge
    a simultaneously asserted positive freshness claim.
  failure_mode: Generated artifacts become stale or authoritative without proof.
  justification_ref: standards/artifacts/pull-request-description/v1/proofs.yaml#PRD-SEM-012
- id: PRD-SEM-013
  invariant: The adopted migration and release profiles conservatively require sequencing and reversal context.
  applies_to:
  - change_profiles
  - migration_rollout
  - risk_and_rollback
  - evidence
  check: Migration or release profiles require Migration / Rollout, Risk / Rollback, and evidence or explicit readiness
    non-claims. This is a declared profile convention for these review risks; it is not a claim that all releases
    are inherently hard to revert.
  failure_mode: Reviewers cannot evaluate deploy, compatibility, or release risk.
  justification_ref: standards/artifacts/pull-request-description/v1/proofs.yaml#PRD-SEM-013
- id: PRD-SEM-014
  invariant: Dependency changes must surface supply-chain review facts when material.
  applies_to:
  - change_profiles
  - impact
  - evidence
  - risk_and_rollback
  check: If change_profiles includes dependency, state material runtime/developer impact and include advisory, license,
    lockfile, install-script, or transitive-risk evidence when relevant.
  failure_mode: A dependency change is reviewed as a version number instead of a supply-chain change.
  justification_ref: standards/artifacts/pull-request-description/v1/proofs.yaml#PRD-SEM-014
- id: PRD-SEM-015
  invariant: Refactor and formatting profiles must not imply behavior change.
  applies_to:
  - change_profiles
  - context
  - non_claims
  - evidence
  check: If change_profiles includes refactor or formatting and behavior is not intended to change, state that boundary
    in Context or Non-Claims; include evidence only when behavior preservation is a review-relevant claim.
  failure_mode: Readers infer behavior change from a mechanical or structural PR, or infer equivalence without proof.
  justification_ref: standards/artifacts/pull-request-description/v1/proofs.yaml#PRD-SEM-015
- id: PRD-SEM-016
  invariant: Readiness and urgency are independent and visible when material.
  applies_to:
  - readiness_state
  - non_claims
  - review_focus
  - risk_and_rollback
  check: Draft or blocked readiness requires Non-Claims and Review Focus. Emergency urgency requires Risk / Rollback,
    Non-Claims, and available evidence or explicit evidence limitations, regardless of readiness. Do not imply complete
    validation.
  failure_mode: Reviewers mistake unfinished or expedited work for ordinary merge-ready work.
  justification_ref: standards/artifacts/pull-request-description/v1/proofs.yaml#PRD-SEM-016
- id: PRD-SEM-017
  invariant: Issue links must distinguish contextual reference from lifecycle-changing closure.
  applies_to:
  - links
  check: Every link with type issue must include relationship. Use fixes, closes, or resolves only when merging
    this PR is intended to satisfy and close or resolve the target issue under the hosting platform's target-branch
    semantics. Use relates_to, references, depends_on, blocks, supersedes, or duplicates when no closure claim is
    intended.
  failure_mode: A neutral issue reference is rendered as Fixes or Closes, causing an accidental lifecycle claim
    or issue closure.
  justification_ref: standards/artifacts/pull-request-description/v1/proofs.yaml#PRD-SEM-017
- id: PRD-SEM-018
  invariant: Reviewer questions are a bounded audit checklist, not a sufficiency theorem.
  applies_to:
  - summary
  - context
  - impact
  - links
  - evidence
  - risk_and_rollback
  - migration_rollout
  - security_privacy
  - visual_evidence
  - non_claims
  - review_focus
  check: Use the universal questions and each conditional question whose factual trigger applies. Answer through
    the selected visible sections or platform/source evidence. The questions cover this declared review model; new
    material concerns require extending that model, not claiming global completeness. Unknown triggers remain unresolved.
  failure_mode: The PR either omits a review-critical answer or publishes a noisy questionnaire as boilerplate.
  justification_ref: standards/artifacts/pull-request-description/v1/proofs.yaml#PRD-SEM-018
