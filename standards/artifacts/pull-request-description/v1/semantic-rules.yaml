schema_version: "agent-operating-standards.semantic-rules/v1"
standard: "artifact.pull-request-description.v1"
scope: "pull_request_description"
rules:
  - id: "PRD-SEM-001"
    invariant: "Every pull request description must answer what changed and why it exists."
    applies_to:
      - "title"
      - "summary"
      - "context"
      - "review_scope"
      - "change_profiles"
      - "readiness_state"
    check: "Title, Summary, Context, review_scope, change_profiles, and readiness_state must be non-empty, factual, and specific enough to distinguish this PR from nearby changes."
    failure_mode: "Reviewers cannot decide whether the change should exist."
  - id: "PRD-SEM-002"
    invariant: "Optional sections must be triggered by the actual change."
    applies_to:
      - "impact"
      - "changes"
      - "links"
      - "evidence"
      - "risk_and_rollback"
      - "migration_rollout"
      - "security_privacy"
      - "visual_evidence"
      - "non_claims"
      - "review_focus"
    check: "Include an optional field only when the decision tree trigger is true; omit empty, placeholder, and not-applicable sections."
    failure_mode: "The PR body becomes boilerplate that reviewers ignore."
  - id: "PRD-SEM-003"
    invariant: "Evidence data and visible Evidence sections are separate."
    applies_to:
      - "evidence"
    check: "Record structured evidence when proof-bearing claims need it; render visible Evidence only when the evidence is failed, skipped, missing, manual, security-sensitive, runtime/release-related, generated-freshness-related, or requires reviewer action."
    failure_mode: "Either proof is missing for a claim or routine validation noise hides the useful description."
  - id: "PRD-SEM-004"
    invariant: "The final PR body must not contain a routine Validation section."
    applies_to:
      - "evidence"
    check: "Use Evidence, not Validation, when proof must be visible; do not list commands, checkboxes, or not-run tests by default."
    failure_mode: "Routine validation boilerplate trains reviewers to skip the description."
  - id: "PRD-SEM-005"
    invariant: "Links must point to owner surfaces when an external claim owner matters."
    applies_to:
      - "links"
    check: "If a PR depends on an issue, standard, spec, schema, incident, policy, design, or evidence artifact, include Links to those owner surfaces."
    failure_mode: "The PR body promotes convenient context into authority."
  - id: "PRD-SEM-006"
    invariant: "Risk and rollback are required only when failure or reversal is non-obvious."
    applies_to:
      - "risk_and_rollback"
    check: "Include Risk / Rollback for data, deploy, security, dependency, user-facing, migration, irreversible, or hard-to-revert changes; omit it for trivial reversible changes."
    failure_mode: "Reviewers either miss operational risk or read irrelevant rollback boilerplate."
  - id: "PRD-SEM-007"
    invariant: "Impact must be stated when the change affects a decision-maker outside the diff."
    applies_to:
      - "impact"
    check: "Include Impact when users, business behavior, operators, developers, cost, performance, accessibility, compliance, or support are affected."
    failure_mode: "Reviewers cannot evaluate the change at the correct product or operational level."
  - id: "PRD-SEM-008"
    invariant: "Security and privacy claims must not be hidden in generic prose."
    applies_to:
      - "security_privacy"
    check: "Include Security / Privacy when auth, authorization, secrets, sensitive data, logging, permissions, abuse controls, or disclosure surfaces are touched. Do not include secrets, credentials, exploit instructions, sensitive repository data, or disclosure details that belong in a private security channel."
    failure_mode: "Security-sensitive changes are reviewed as ordinary implementation detail."
  - id: "PRD-SEM-009"
    invariant: "Non-claims must block predictable overclaims."
    applies_to:
      - "non_claims"
    check: "If readers could infer release readiness, production readiness, downstream adoption, runtime proof, security approval, or complete validation that the PR does not prove, include Non-Claims."
    failure_mode: "Readers infer stronger readiness or authority than the PR owns."
  - id: "PRD-SEM-010"
    invariant: "Review focus must guide review without creating hidden requirements."
    applies_to:
      - "review_focus"
    check: "Include Review Focus only for non-obvious surfaces, risks, or generated artifacts that deserve reviewer attention; do not introduce new acceptance criteria."
    failure_mode: "The PR body creates requirements outside the owner surface."
  - id: "PRD-SEM-011"
    invariant: "Change profiles are composable and must trigger profile obligations."
    applies_to:
      - "change_profiles"
    check: "Apply every matching profile independently; security, migration, generated, dependency, release, configuration, emergency, draft, and refactor obligations can compose in one PR."
    failure_mode: "A single primary type hides secondary risk and proof obligations."
  - id: "PRD-SEM-012"
    invariant: "Generated-output PRs must preserve source-to-projection traceability."
    applies_to:
      - "change_profiles"
      - "links"
      - "evidence"
    check: "If change_profiles includes generated, include source owner links and evidence for generator, command, or freshness unless the PR explicitly states that freshness is not claimed."
    failure_mode: "Generated artifacts become stale or authoritative without proof."
  - id: "PRD-SEM-013"
    invariant: "Migration and release profiles require sequencing and rollback context."
    applies_to:
      - "change_profiles"
      - "migration_rollout"
      - "risk_and_rollback"
      - "evidence"
    check: "If change_profiles includes migration or release, include rollout or sequencing context, rollback or forward-fix path, and evidence or non-claims for readiness."
    failure_mode: "Reviewers cannot evaluate deploy, compatibility, or release risk."
  - id: "PRD-SEM-014"
    invariant: "Dependency changes must surface supply-chain review facts when material."
    applies_to:
      - "change_profiles"
      - "impact"
      - "evidence"
      - "risk_and_rollback"
    check: "If change_profiles includes dependency, state material runtime/developer impact and include advisory, license, lockfile, install-script, or transitive-risk evidence when relevant."
    failure_mode: "A dependency change is reviewed as a version number instead of a supply-chain change."
  - id: "PRD-SEM-015"
    invariant: "Refactor and formatting profiles must not imply behavior change."
    applies_to:
      - "change_profiles"
      - "context"
      - "non_claims"
      - "evidence"
    check: "If change_profiles includes refactor or formatting and behavior is not intended to change, state that boundary in Context or Non-Claims; include evidence only when behavior preservation is a review-relevant claim."
    failure_mode: "Readers infer behavior change from a mechanical or structural PR, or infer equivalence without proof."
  - id: "PRD-SEM-016"
    invariant: "Draft, blocked, and emergency readiness states must be explicit."
    applies_to:
      - "readiness_state"
      - "non_claims"
      - "review_focus"
      - "risk_and_rollback"
    check: "If readiness_state is draft or blocked, make non-readiness visible when review is requested; if readiness_state is emergency, include risk, rollback, and available evidence without implying full validation."
    failure_mode: "Reviewers mistake unfinished or expedited work for ordinary merge-ready work."
