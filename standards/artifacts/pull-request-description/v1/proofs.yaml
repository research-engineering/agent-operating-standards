schema_version: agent-operating-standards.justifications/v1
standard: artifact.pull-request-description.v1
model_ref: docs/FORMAL_MODEL.md
proofs:
- id: PRD-SEM-001
  kind: conditional_invariant
  scope: The change and its motivation are decision-relevant.
  definitions:
    information: The omitted decision-relevant information is available by any adequate admitted route.
    same_input: The decision procedure receives indistinguishable inputs in the two specified worlds.
    left_accept: The procedure accepts the left-world claim/action.
    right_accept: The procedure accepts the right-world claim/action.
    correct_left: The procedure makes the stipulated correct acceptance in the left world.
    correct_right: The procedure makes the stipulated correct rejection in the right world.
  premises:
  - formula:
      implies:
      - not: information
      - same_input
    basis: environment_assumption
    rationale: In this bounded witness pair all other available decision inputs are identical. The identified information
      is the distinguishing input; an equivalent owner/reference route counts as information.
  - formula:
      implies:
      - same_input
      - all:
        - implies:
          - left_accept
          - right_accept
        - implies:
          - right_accept
          - left_accept
    basis: environment_assumption
    rationale: A deterministic decision procedure must give the same result for the same input. Randomization cannot
      guarantee opposite correct decisions on indistinguishable inputs either; the finite model fixes one procedure
      outcome.
  - formula:
      implies:
      - correct_left
      - left_accept
    basis: definition
    rationale: The declared goal accepts the left-world case. This is the goal in scope, not an assertion that an
      observed PR belongs to that world.
  - formula:
      implies:
      - correct_right
      - not: right_accept
    basis: definition
    rationale: The same goal rejects the right-world case because the named material condition differs.
  conclusion:
    implies:
    - all:
      - correct_left
      - correct_right
    - information
  derivation:
  - Assume both decisions are correct and the distinguishing information is absent. The observation premise gives
    same_input, so the decision outcomes are equal.
  - Correctness requires left_accept and not right_accept. These contradict equal outcomes. Therefore a procedure
    guaranteeing both correct decisions needs the distinguishing information (or must withhold the unsupported decision).
  - This proves the need for the semantic distinction in the specified two-world domain. It does not require one
    specific heading, field name, serialization, or duplicate copy of the information.
  countermodel:
    removed_premise: 3
    assignment:
      correct_left: true
      correct_right: true
      information: false
      left_accept: true
      right_accept: true
      same_input: true
  alternatives:
  - An exact owner reference, inline data or another independently verified route can carry the same distinction.
    The selected artifact format chooses one route; necessity of the information does not prove uniqueness of that
    encoding.
  non_claims:
  - The witness pair is an explicit bounded model, not an observed incident. Applicability of the decision goal,
    availability of equivalent inputs and factual source truth require independent semantic review.
  separation_witness:
    left_world: The stated change addresses the selected accepted purpose.
    right_world: The same visible diff addresses a different, unaccepted purpose.
    omitted_information: The identity of the changed surface and the actual reason for the change.
- id: PRD-SEM-002
  kind: policy_choice
  scope: The visible section has a resolved decision-tree trigger.
  definitions:
    valid: The description is compliant with this declared review obligation.
    needed: The obligation in scope applies.
    answered: The required information or constraint is satisfied.
  premises:
  - formula:
      implies:
      - valid
      - implies:
        - needed
        - answered
    basis: accepted_goal
    rationale: The adopted rendering model requires exactly the union of true triggers.
  conclusion:
    implies:
    - all:
      - needed
      - not: answered
    - not: valid
  derivation:
  - Instantiate compliance at this specific obligation. Under needed, compliance would imply answered. If answered
    is false, modus tollens excludes compliance.
  - An untriggered optional section is excluded by this rendering convention, not by a law of cognition.
  countermodel:
    removed_premise: 0
    assignment:
      answered: false
      needed: true
      valid: true
  alternatives:
  - Alternative artifact formats can satisfy the same information goal. The selected PR convention applies only
    after repository adoption.
  non_claims:
  - The Boolean implication does not establish that the factual trigger is true; its source and semantic adequacy
    require independent review.
