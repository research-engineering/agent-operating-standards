- id: PRD-POL-001
  kind: policy_choice
  scope: Title and heading interoperability for this adopted GitHub PR format.
  definitions:
    valid: The title/body follows this format.
    standalone: The title identifies the change outside the PR page.
    headings: The body uses the selected Summary and Context names.
  premises:
  - formula:
      implies:
      - valid
      - all:
        - standalone
        - headings
    basis: accepted_policy
    rationale: Stable history labels and headings are selected interoperability requirements, not universal necessities.
  conclusion:
    implies:
    - valid
    - headings
  derivation:
  - Conjunction elimination derives the chosen heading convention from format conformance.
  - Information sufficiency alone does not derive English headings; that convention is an explicit additional premise.
  countermodel:
    removed_premise: 0
    assignment:
      headings: false
      standalone: true
      valid: true
  alternatives:
  - Change/Reason headings or a single paragraph could carry the same information; adopting a common renderer/parser
    contract motivates this particular choice.
  non_claims:
  - No unique optimal text or universal imperative-title requirement.
