schema_version: agent-operating-standards.standard-package/v1
id: artifact.roadmap.v1
title: Roadmap Artifact
lifecycle: active
owner_surface: standards/artifacts/roadmap/v1/standard.md
agent_entrypoint: standards/artifacts/roadmap/v1/standard.yaml
artifact:
  type: roadmap
  canonical_surface: docs/planning/roadmap.yaml
  generated_projection: ROADMAP.md
  scope: repository planning
authority:
  owned_claim_types:
  - plan
  - priority
  - horizon
  - intent
  - sequencing
  - uncertainty
  forbidden_claim_types:
  - requirement
  - architecture
  - decision
  - api_contract
  - security
  - runtime_fact
  - evidence
  - release_fact
  - release_guarantee
  precedence: Roadmap planning is weaker than requirements, architecture, API contracts, security policy, evidence,
    releases, and runtime facts.
agent_contract:
  final_instruction: Edit the canonical roadmap selected by the repository binding. Apply its schema and every semantic
    rule. Follow owner links before implementation; an absent owner requires an approved scoped exception. Exact
    scheduling dates require commitment_basis or external_board. Shipped status is not release evidence. Keep planning
    and evidence authority distinct.
  required_inputs:
  - repository_binding
  - canonical_roadmap
  - authority_links
  required_sections:
  - schema_version
  - doc_type
  - canonical
  - scope
  - owner
  - last_reviewed
  - review_cadence
  - authority
  - items
  - non_claims
  optional_sections:
  - generated_projection
  - external_board
  - themes
  - local_roadmaps
  - risks
  - dependencies
  - exceptions
  - rendering
  output_format: yaml_canonical_with_markdown_projection
  proof_policy:
    include_standard_proof_in_output: false
    include_artifact_evidence: Roadmap items must link to stronger owner surfaces or exit evidence; the roadmap
      itself is not proof.
    proof_location: standards/artifacts/roadmap/v1/standard.md
  semantic_obligations:
  - Reject requirement, architecture, security, runtime or release facts established only by roadmap text. Follow
    typed owner links before implementation.
  - For an exact scheduling date in an item, require commitment_basis or external_board. last_reviewed is a review
    timestamp, not a delivery promise. Validate dates and the relevance of the basis; arbitrary prose date expressions
    still require semantic review.
  - Before implementation, resolve each implementation-relevant authority_link to its owner. If a needed owner is
    absent, require an approved applicable exception under authority.exception-protocol.v1; a roadmap exception
    id alone does not approve work.
  - Before citing shipped work as a release fact, follow a release/changelog owner link. A roadmap status alone
    proves no release.
validation:
  schema: standards/artifacts/roadmap/v1/schema.json
  semantic_rules: standards/artifacts/roadmap/v1/semantic-rules.yaml
  template: standards/artifacts/roadmap/v1/template.yaml
  justifications: standards/artifacts/roadmap/v1/proofs.yaml
non_claims:
- The roadmap does not define requirements.
- The roadmap does not prove architecture, runtime state, release state, or security posture.
- The roadmap does not create delivery commitments unless a stronger owner surface says so.
