schema_version: "agent-operating-standards.agent-operating-kernel/v1"
artifact_type: "agent_operating_kernel"
invariants:
  - id: "KERNEL-001"
    class:
      - "kernel"
      - "adoption"
    statement: "Durable agent instructions must be owned by admitted versioned standards, not by chat history, filenames, templates, or generated projections."
    owner_surface: "standards/meta/agent-operating-kernel/v1/standard.md"
    enforcement:
      - "normative_standard"
      - "semantic_review"
    applies_to:
      - "all admitted standards"
      - "agent harnesses"
      - "consumer repository bindings"
    agent_effect: "Promote repeated instructions into standards or record bounded exceptions."
    failure_mode: "Agents treat local convention as hidden authority."
    proof_location: "standards/meta/agent-operating-kernel/v1/standard.md#kernel-001-standards-own-durable-instructions"
  - id: "KERNEL-002"
    class:
      - "kernel"
      - "artifact"
    statement: "Routine artifact creation must use standard.yaml agent_contract as the executable instruction, with standard.md reserved for proof, dispute, exception, or maintenance."
    owner_surface: "standards/meta/agent-operating-kernel/v1/standard.md"
    enforcement:
      - "normative_standard"
      - "producer_skill"
      - "semantic_review"
    applies_to:
      - "standards/**/standard.yaml"
      - "standards/**/standard.md"
      - "external agent consumption"
    agent_effect: "Load the selected standard's machine entrypoint before prose rationale."
    failure_mode: "Agents either miss the executable contract or over-load proof text into routine work."
    proof_location: "standards/meta/agent-operating-kernel/v1/standard.md#kernel-002-machine-entrypoint-first"
  - id: "KERNEL-003"
    class:
      - "artifact"
      - "semantic"
    statement: "Generated artifacts must contain artifact-relevant evidence only, not the formal proof of the standard itself."
    owner_surface: "standards/meta/agent-operating-kernel/v1/standard.md"
    enforcement:
      - "normative_standard"
      - "semantic_review"
    applies_to:
      - "templates"
      - "generated artifacts"
      - "pull request descriptions"
    agent_effect: "Keep proof in standards, semantic rules, validators, tests, or evidence artifacts."
    failure_mode: "Generated artifacts become boilerplate and lose review value."
    proof_location: "standards/meta/agent-operating-kernel/v1/standard.md#kernel-003-proof-is-not-output-boilerplate"
  - id: "KERNEL-004"
    class:
      - "kernel"
      - "semantic"
    statement: "Agents must classify claim type before using an artifact as authority."
    owner_surface: "standards/meta/agent-operating-kernel/v1/standard.md"
    enforcement:
      - "normative_standard"
      - "semantic_review"
    applies_to:
      - "authority decisions"
      - "artifact standards"
      - "generated projections"
    agent_effect: "Use the artifact only for claim types its standard explicitly owns."
    failure_mode: "Orientation text is promoted into requirements, architecture, release truth, or runtime truth."
    proof_location: "standards/meta/agent-operating-kernel/v1/standard.md#kernel-004-claim-type-before-authority"
  - id: "KERNEL-005"
    class:
      - "validation"
      - "semantic"
    statement: "Deterministic gates and semantic review are separate proof classes and neither replaces the other."
    owner_surface: "standards/meta/agent-operating-kernel/v1/standard.md"
    enforcement:
      - "ci"
      - "schema"
      - "semantic_review"
    applies_to:
      - "schemas"
      - "CI"
      - "review bots"
      - "semantic rules"
    agent_effect: "Use CI/schema for structure and use semantic review for meaning, sufficiency, trigger correctness, and over-claims."
    failure_mode: "A structural pass is treated as semantic truth or semantic review hides a missing hard gate."
    proof_location: "standards/meta/agent-operating-kernel/v1/standard.md#kernel-005-deterministic-gates-and-semantic-review-are-different"
  - id: "KERNEL-006"
    class:
      - "adoption"
      - "validation"
    statement: "Producer-side artifact generation reduces errors but must not replace consumer-side deterministic enforcement."
    owner_surface: "standards/meta/agent-operating-kernel/v1/standard.md"
    enforcement:
      - "producer_skill"
      - "ci"
      - "normative_standard"
    applies_to:
      - "skills"
      - "harness adapters"
      - "consumer repositories"
    agent_effect: "Generate compliant artifacts by default, validate them in the adopting repository, and keep executable skills in harness or capability repositories unless a standard defines their package shape."
    failure_mode: "Compliance depends on which actor created the artifact."
    proof_location: "standards/meta/agent-operating-kernel/v1/standard.md#kernel-006-producer-prevention-plus-consumer-enforcement"
  - id: "KERNEL-007"
    class:
      - "artifact"
      - "validation"
    statement: "Generated projections are not canonical unless a repository binding declares canonicality and freshness evidence exists."
    owner_surface: "standards/meta/agent-operating-kernel/v1/standard.md"
    enforcement:
      - "normative_standard"
      - "ci"
      - "semantic_review"
    applies_to:
      - "Markdown projections"
      - "HTML projections"
      - "GitHub templates"
      - "rendered views"
    agent_effect: "Edit canonical sources first and cite projections only with freshness evidence."
    failure_mode: "Stale rendered output becomes source of truth."
    proof_location: "standards/meta/agent-operating-kernel/v1/standard.md#kernel-007-generated-projections-are-not-canonical-by-default"
  - id: "KERNEL-008"
    class:
      - "kernel"
      - "adoption"
    statement: "Exceptions must be scoped, typed, owned, and reviewed or promoted."
    owner_surface: "standards/meta/agent-operating-kernel/v1/standard.md"
    enforcement:
      - "exception_protocol"
      - "semantic_review"
    applies_to:
      - "standard exceptions"
      - "repository bindings"
      - "artifact standards"
    agent_effect: "Use the exception protocol instead of inventing hidden permanent rules."
    failure_mode: "Temporary deviations become undocumented policy."
    proof_location: "standards/meta/agent-operating-kernel/v1/standard.md#kernel-008-exceptions-are-bounded"
  - id: "KERNEL-009"
    class:
      - "artifact"
      - "semantic"
    statement: "Generated outputs should contain exactly the facts required by the target decision: no fewer and no more."
    owner_surface: "standards/meta/agent-operating-kernel/v1/standard.md"
    enforcement:
      - "semantic_review"
      - "producer_skill"
    applies_to:
      - "generated artifacts"
      - "pull request descriptions"
      - "issues"
      - "release notes"
    agent_effect: "Remove empty sections, placeholders, ceremonial checklists, and proof-shaped noise."
    failure_mode: "Reviewers stop reading generated artifacts."
    proof_location: "standards/meta/agent-operating-kernel/v1/standard.md#kernel-009-output-contains-exactly-review-relevant-facts"
  - id: "KERNEL-010"
    class:
      - "kernel"
      - "semantic"
    statement: "Artifact standards and projections must not override stronger owner surfaces."
    owner_surface: "standards/meta/agent-operating-kernel/v1/standard.md"
    enforcement:
      - "normative_standard"
      - "semantic_review"
    applies_to:
      - "artifact standards"
      - "generated projections"
      - "authority decisions"
    agent_effect: "Cite stronger owner surfaces for requirements, architecture, security, runtime facts, releases, and API contracts."
    failure_mode: "Convenient artifacts silently become authority for claims they do not own."
    proof_location: "standards/meta/agent-operating-kernel/v1/standard.md#kernel-010-stronger-owner-surfaces-win"
non_claims:
  - "The kernel does not define product requirements."
  - "The kernel does not define application architecture, API contracts, security policy, runtime facts, release facts, or release guarantees."
  - "The kernel does not make downstream repositories compliant."
  - "The kernel does not define a CI, GitHub App, renderer, executable skill, or harness implementation."
