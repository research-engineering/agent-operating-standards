schema_version: "agent-operating-standards.semantic-rules/v1"
standard: "meta.agent-operating-kernel.v1"
scope: "agent_operating_kernel"
rules:
  - id: "AOK-SEM-001"
    invariant: "Recurring agent instructions must be promoted to admitted standards."
    applies_to:
      - "invariants"
      - "standards_catalog"
      - "repository_binding"
    check: "If an instruction should be reused across artifacts, repositories, or agents, it must have an admitted standard owner or a bounded exception."
    failure_mode: "Agents treat chat history or local convention as durable authority."
  - id: "AOK-SEM-002"
    invariant: "Routine agent execution must load the machine entrypoint before prose proof."
    applies_to:
      - "standard.yaml"
      - "agent_contract"
      - "standard.md"
    check: "Use standard.yaml agent_contract for routine execution; load standard.md for proof, dispute, exception, or maintenance."
    failure_mode: "Agents spend tokens on rationale or miss the executable contract."
  - id: "AOK-SEM-003"
    invariant: "Generated projections must not become canonical without declared freshness evidence."
    applies_to:
      - "generated_projection"
      - "rendered_view"
      - "template"
    check: "Treat Markdown, HTML, GitHub templates, and rendered views as projections unless the binding declares canonicality and freshness evidence exists."
    failure_mode: "Agents edit or cite stale projections as source of truth."
  - id: "AOK-SEM-004"
    invariant: "Deterministic gates and semantic review must not claim each other's proof class."
    applies_to:
      - "schema"
      - "ci"
      - "semantic_rules"
      - "review_bot"
    check: "Use CI/schema for structure and forbidden forms; use semantic review for truth, sufficiency, trigger correctness, and over-claims."
    failure_mode: "A syntax pass is treated as meaning proof, or semantic review replaces a missing structural gate."
  - id: "AOK-SEM-005"
    invariant: "Generated artifacts must not include standard proof as boilerplate."
    applies_to:
      - "template"
      - "generated_artifact"
      - "proof_policy"
    check: "Keep formal proof in standards and evidence artifacts; generated output should include only artifact-relevant evidence."
    failure_mode: "Artifacts become noisy and reviewers stop reading them."
  - id: "AOK-SEM-006"
    invariant: "Exceptions must be bounded and typed."
    applies_to:
      - "exceptions"
      - "exception_protocol"
    check: "Every exception must declare scope, reason, allowed and forbidden claim types, owner, review trigger or expiry, and promotion or removal gate."
    failure_mode: "Temporary deviations become hidden permanent standards."
  - id: "AOK-SEM-007"
    invariant: "Producer-side compliance must not replace consumer-side enforcement."
    applies_to:
      - "producer_skill"
      - "ci"
      - "review_bot"
      - "repository_binding"
    check: "A skill or harness may create compliant artifacts, but adopting repositories still need deterministic gates for enforceable structure."
    failure_mode: "Compliance depends on which actor created the artifact."
  - id: "AOK-SEM-008"
    invariant: "Artifact standards must not override stronger owner surfaces."
    applies_to:
      - "authority"
      - "owned_claim_types"
      - "forbidden_claim_types"
    check: "Reject any artifact standard or projection that creates requirements, architecture, API contracts, security policy, runtime facts, release facts, or release guarantees outside its owned claim types."
    failure_mode: "Convenient artifacts silently override stronger authority."
