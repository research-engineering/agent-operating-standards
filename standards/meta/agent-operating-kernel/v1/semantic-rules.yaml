schema_version: agent-operating-standards.semantic-rules/v1
standard: meta.agent-operating-kernel.v1
scope: agent_operating_kernel
rules:
- id: AOK-SEM-001
  invariant: Use recurring instructions as durable authority only through a selected versioned owner or an independently
    approved bounded exception.
  applies_to:
  - invariants
  - standards_catalog
  - repository_binding
  check: Use recurring instructions as durable authority only through a selected versioned owner or an independently
    approved bounded exception.
  failure_mode: Agents treat chat history or local convention as durable authority.
  justification_ref: standards/meta/agent-operating-kernel/v1/proofs.yaml#KERNEL-001
- id: AOK-SEM-002
  invariant: Use the declared machine entrypoint when present; otherwise load the prose owner. A routine projection
    must preserve all applicable rules.
  applies_to:
  - standard.yaml
  - agent_contract
  - standard.md
  check: Use the declared machine entrypoint when present; otherwise load the prose owner. A routine projection
    must preserve all applicable rules.
  failure_mode: Agents spend tokens on rationale or miss the executable contract.
  justification_ref: standards/meta/agent-operating-kernel/v1/proofs.yaml#KERNEL-002
- id: AOK-SEM-003
  invariant: Generated provenance grants no canonical authority. Use the bound source owner; change ownership only
    through an explicit binding migration.
  applies_to:
  - generated_projection
  - rendered_view
  - template
  check: Generated provenance grants no canonical authority. Use the bound source owner; change ownership only through
    an explicit binding migration.
  failure_mode: Agents edit or cite stale projections as source of truth.
  justification_ref: standards/meta/agent-operating-kernel/v1/proofs.yaml#KERNEL-007
- id: AOK-SEM-004
  invariant: Classify evidence by the proposition it proves, not by its executor. A structural pass alone does not
    prove unrelated semantics; deterministic semantic proofs are admissible.
  applies_to:
  - schema
  - ci
  - semantic_rules
  - review_bot
  check: Classify evidence by the proposition it proves, not by its executor. A structural pass alone does not prove
    unrelated semantics; deterministic semantic proofs are admissible.
  failure_mode: Evidence is cited for a proposition outside the model and scope it establishes.
  justification_ref: standards/meta/agent-operating-kernel/v1/proofs.yaml#KERNEL-005
- id: AOK-SEM-005
  invariant: Preserve evidence required by the artifact claim. Place standard rationale outside routine output only
    when doing so preserves that evidence and access to its owner.
  applies_to:
  - template
  - generated_artifact
  - proof_policy
  check: Preserve evidence required by the artifact claim. Place standard rationale outside routine output only
    when doing so preserves that evidence and access to its owner.
  failure_mode: Artifacts become noisy and reviewers stop reading them.
  justification_ref: standards/meta/agent-operating-kernel/v1/proofs.yaml#KERNEL-003
- id: AOK-SEM-006
  invariant: Use an exception only with independent scope approval, disjoint allowed/forbidden claims and an unexpired
    lifetime; missing facts do not grant authority.
  applies_to:
  - exceptions
  - exception_protocol
  check: Use an exception only with independent scope approval, disjoint allowed/forbidden claims and an unexpired
    lifetime; missing facts do not grant authority.
  failure_mode: Temporary deviations become hidden permanent standards.
  justification_ref: standards/meta/agent-operating-kernel/v1/proofs.yaml#KERNEL-008
- id: AOK-SEM-007
  invariant: At an untrusted consumer boundary, validate exact artifact bytes unless a sufficient unchanged certificate
    is independently reusable.
  applies_to:
  - producer_skill
  - ci
  - review_bot
  - repository_binding
  check: At an untrusted consumer boundary, validate exact artifact bytes unless a sufficient unchanged certificate
    is independently reusable.
  failure_mode: Compliance depends on which actor created the artifact.
  justification_ref: standards/meta/agent-operating-kernel/v1/proofs.yaml#KERNEL-006
- id: AOK-SEM-008
  invariant: Do not override a claim outside delegated authority. Resolve incomparable-owner conflicts explicitly;
    a convenient artifact never creates delegation.
  applies_to:
  - authority
  - owned_claim_types
  - forbidden_claim_types
  check: Do not override a claim outside delegated authority. Resolve incomparable-owner conflicts explicitly; a
    convenient artifact never creates delegation.
  failure_mode: Convenient artifacts silently override stronger authority.
  justification_ref: standards/meta/agent-operating-kernel/v1/proofs.yaml#KERNEL-010
