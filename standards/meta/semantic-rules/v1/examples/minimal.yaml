schema_version: agent-operating-standards.semantic-rules/v1
standard: artifact.pull-request-description.v1
scope: pull_request_description
rules:
- id: PRD-SEM-001
  invariant: Every pull request description must answer what changed and why it exists.
  applies_to:
  - title
  - summary
  - context
  - review_scope
  - change_profiles
  - readiness_state
  check: Title, Summary, Context, review_scope, change_profiles, and readiness_state must be non-empty, factual,
    and specific enough to distinguish this PR from nearby changes.
  failure_mode: Reviewers cannot decide whether the change should exist.
  justification_ref: standards/artifacts/pull-request-description/v1/proofs.yaml#PRD-SEM-001
