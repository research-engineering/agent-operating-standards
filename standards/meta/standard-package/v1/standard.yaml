schema_version: agent-operating-standards.standard-package/v1
id: meta.standard-package.v1
title: Standard Package
lifecycle: active
owner_surface: standards/meta/standard-package/v1/standard.md
agent_entrypoint: standards/meta/standard-package/v1/standard.yaml
artifact:
  type: standard_package
  canonical_surface: standards/*/*/v*/standard.md
  generated_projection: null
  scope: admitted operating standards
authority:
  owned_claim_types:
  - agent_instruction
  - orientation
  forbidden_claim_types:
  - runtime_fact
  - release_fact
  - release_guarantee
  precedence: The catalog selects the package; standard.yaml instructs routine use; standard.md owns proof and disputes.
agent_contract:
  final_instruction: Select the package through the bound catalog. If agent_entrypoint exists, load it and its named
    schema and semantic rules. If absent or null, load the prose owner plus catalog-named schema/rules as the routine
    fallback. A generated core may replace the full entrypoint only if it preserves the complete agent_contract
    and semantic rules and names the same schema. Load proof records for justification review; record shape does
    not prove policy necessity.
  required_inputs:
  - catalog_entry
  - target_artifact
  - repository_binding
  required_sections:
  - schema_version
  - id
  - title
  - lifecycle
  - owner_surface
  - agent_entrypoint
  - artifact
  - authority
  - agent_contract
  - validation
  - non_claims
  optional_sections:
  - runtime_contracts
  decision_tree: []
  output_format: machine_readable_standard_manifest
  proof_policy:
    include_standard_proof_in_output: false
    include_artifact_evidence: Only include evidence required by the artifact being produced.
    proof_location: standard.md and semantic-rules.yaml
  semantic_obligations:
  - Package authority.owned_claim_types and authority.forbidden_claim_types must be disjoint. Classification
    of claim names still requires the selected claim-type owner; this check does not create a vocabulary registry.
  - Validate each non-null declared structured validation.template (.yaml, .yml or .json) and every recursive .yaml, .yml and .json example against
    the complete selected artifact schema. Missing version markers do not remove these declared obligations.
  - Before an authority-sensitive compact-contract decision, resolve source_manifest through the selected catalog
    and repository binding and use its authority declaration. Core equality alone does not establish execution
    by a real consumer.
validation:
  schema: standards/meta/standard-package/v1/schema.json
  semantic_rules: null
  template: standards/meta/standard-package/v1/template.yaml
  justifications: standards/meta/standard-package/v1/proofs.yaml
non_claims:
- This entrypoint does not define consumer project policy.
- This entrypoint does not make templates authoritative.
- This entrypoint does not define a renderer implementation.
