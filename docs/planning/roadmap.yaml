schema_version: "agent-operating-standards.roadmap/v1"
doc_type: "roadmap"
canonical: true
scope: "repository"
owner: "standards maintainer"
last_reviewed: "2026-09-20"
review_cadence: "monthly"
generated_projection: "ROADMAP.md"
authority:
  owns_claim_types:
    - "plan"
    - "priority"
    - "horizon"
    - "intent"
    - "sequencing"
    - "uncertainty"
  must_not_define:
    - "requirement"
    - "architecture"
    - "decision"
    - "api_contract"
    - "security"
    - "runtime_fact"
    - "evidence"
    - "release_fact"
    - "release_guarantee"
  conflict_rule: "typed authority wins over roadmap"
themes:
  - "artifact standards"
  - "agent policy"
  - "validation"
items:
  - id: "RM-001"
    title: "Admit roadmap artifact standard"
    status: "active"
    horizon: "now"
    confidence: "high"
    owner: "standards maintainer"
    planning_claim: "Create a canonical roadmap standard that prevents planning artifacts from defining requirements or evidence."
    authority_links:
      - relation: "depends_on"
        target: "standards/authority/claim-types/v1/standard.md"
        required_status: "active"
      - relation: "depends_on"
        target: "standards/authority/exception-protocol/v1/standard.md"
        required_status: "active"
    exit_evidence:
      - type: "review"
        target: "Pull request admitting artifact.roadmap.v1."
        required: true
  - id: "RM-002"
    title: "Admit pull request description artifact standard"
    status: "active"
    horizon: "now"
    confidence: "high"
    owner: "standards maintainer"
    planning_claim: "Create a PR description standard with universal Summary and Context, triggered optional sections, and Evidence only when proof changes review."
    authority_links:
      - relation: "depends_on"
        target: "standards/authority/claim-types/v1/standard.md"
        required_status: "active"
    exit_evidence:
      - type: "review"
        target: "Pull request admitting artifact.pull-request-description.v1."
        required: true
  - id: "RM-003"
    title: "Define issue body artifact standard"
    status: "planned"
    horizon: "next"
    confidence: "medium"
    owner: "standards maintainer"
    planning_claim: "Standardize issue bodies without mixing bug reports, proposals, questions, and governance contradictions."
    authority_links:
      - relation: "depends_on"
        target: "standards/artifacts/pull-request-description/v1/standard.md"
        required_status: "active"
    exit_evidence:
      - type: "review"
        target: "Pull request admitting artifact.issue-body.v1."
        required: true
  - id: "RM-004"
    title: "Define release notes artifact standard"
    status: "planned"
    horizon: "next"
    confidence: "medium"
    owner: "standards maintainer"
    planning_claim: "Standardize release text separately from changelog history and release approval."
    authority_links:
      - relation: "depends_on"
        target: "standards/authority/claim-types/v1/standard.md"
        required_status: "active"
    exit_evidence:
      - type: "review"
        target: "Pull request admitting artifact.release-notes.v1."
        required: true
  - id: "RM-005"
    title: "Explore additional renderer tooling"
    status: "exploring"
    horizon: "later"
    confidence: "low"
    owner: "standards maintainer"
    planning_claim: "Explore additional Markdown and HTML renderers beyond the existing validator and PR runtime generator."
    authority_links:
      - relation: "depends_on"
        target: "standards/meta/repository-binding/v1/standard.md"
        required_status: "active"
      - relation: "depends_on"
        target: "standards/artifacts/rendered-view/v1/standard.md"
        required_status: "active"
    exit_evidence:
      - type: "review"
        target: "Pull request admitting additional renderer tooling or explicitly deferring it."
        required: true
  - id: "RM-006"
    title: "Harden validation and artifact handling"
    status: "planned"
    horizon: "next"
    confidence: "high"
    owner: "standards maintainer"
    planning_claim: "Deliver the scoped work packages in the validation hardening design, preserving the distinction between confirmed repairs, proposed contract changes, and retained manual review."
    authority_links:
      - relation: "planned_in"
        target: "docs/design/validation-hardening.md"
      - relation: "depends_on"
        target: "standards/meta/standard-package/v1/standard.md"
        required_status: "active"
      - relation: "depends_on"
        target: "standards/workflows/repository-validation/v1/standard.md"
        required_status: "active"
    exit_evidence:
      - type: "review"
        target: "Owner-bound implementation PRs and acceptance evidence for the selected work packages in docs/design/validation-hardening.md."
        required: true
non_claims:
  - "This roadmap does not define requirements, release commitments, workflow gates, or downstream repository compliance."
  - "This roadmap does not prove that planned standards are accepted before their catalog entries exist."
  - "A merged implementation plan does not mean its repairs or proposed contract changes are implemented."
